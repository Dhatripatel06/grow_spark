<section class="py-10 sm:py-12 lg:py-20 bg-ink text-center">
  <div class="mx-auto max-w-[var(--container-editorial)] px-5 md:px-6 lg:px-8 3xl:px-10" data-reveal>
    <span class="eyebrow !text-accent-bright block mb-3.5">Stay Informed</span>
    <h2 class="text-white mb-4">Get our research before your competitors do</h2>
    <p class="text-white/60 text-[15px] leading-relaxed mb-8">One considered email a month. No noise, no daily digest.</p>
    <form class="flex flex-col sm:flex-row gap-3 max-w-[440px] mx-auto">
      <label for="newsletter-email" class="sr-only">Email address</label>
      <input type="email" id="newsletter-email" name="email" required placeholder="you@company.com" class="form-input !bg-white/5 !border-white/20 !text-white placeholder:!text-white/40 flex-1">
      <button type="submit" class="btn btn-accent shrink-0">Subscribe</button>
    </form>
  </div>
</section>
