<section class="section-pad">
  <div class="container-site">
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_1.3fr] gap-14 lg:gap-20">
      <div data-reveal>
        <span class="eyebrow block mb-4">Get In Touch</span>
        <h2 class="mb-6">Speak with a transformation advisor</h2>
        <p class="text-ink-soft text-[15.5px] leading-relaxed mb-9">Whether you're not sure where to start or you already know the constraint holding you back, we'll tell you honestly whether we're the right fit.</p>

        <div class="space-y-6 mb-10">
          <div>
            <p class="text-[11.5px] font-medium uppercase tracking-[0.1em] text-muted mb-2">Email</p>
            <a href="mailto:hello@growsparkconsulting.com" class="mega-link">hello@growsparkconsulting.com</a>
          </div>
          <div>
            <p class="text-[11.5px] font-medium uppercase tracking-[0.1em] text-muted mb-2">Phone</p>
            <a href="tel:+6500000000" class="mega-link">+65 0000 0000</a>
          </div>
          <div>
            <p class="text-[11.5px] font-medium uppercase tracking-[0.1em] text-muted mb-2">Location</p>
            <p class="text-[15px] text-ink">Singapore</p>
          </div>
        </div>

        <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="Grow Spark Consulting on LinkedIn" class="inline-flex items-center justify-center w-9 h-9 rounded-full border border-hairline text-ink-soft hover:text-accent hover:border-accent transition-colors duration-200">
          <i data-lucide="linkedin" class="w-4 h-4"></i>
        </a>
      </div>

      <div class="bg-paper-raised border border-hairline rounded-[var(--radius-card)] p-8 sm:p-10 lg:p-12" data-reveal>
        <form>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5">
            <div class="form-field">
              <label for="contact-name" class="form-label">Full name</label>
              <input type="text" id="contact-name" name="name" required class="form-input">
            </div>
            <div class="form-field">
              <label for="contact-company" class="form-label">Company</label>
              <input type="text" id="contact-company" name="company" required class="form-input">
            </div>
          </div>
          <div class="form-field">
            <label for="contact-email" class="form-label">Work email</label>
            <input type="email" id="contact-email" name="email" required class="form-input">
          </div>
          <div class="form-field">
            <label for="contact-message" class="form-label">What are you looking to solve?</label>
            <textarea id="contact-message" name="message" required class="form-textarea"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-full sm:w-auto justify-center">Send Inquiry</button>
        </form>
      </div>
    </div>
  </div>
</section>
