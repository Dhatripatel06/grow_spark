<section id="contact-form" class="py-20 sm:py-24 lg:py-28 bg-paper-sunken scroll-mt-24">
  <div class="mx-auto max-w-[var(--container-page)] px-5 sm:px-8">
    <div class="section-head" data-reveal>
      <span class="eyebrow block mb-3.5">Request a Strategy Session</span>
      <h2 id="contact-form-heading">Tell us about your business</h2>
      <p>The more context you give us, the more useful the first conversation will be.</p>
    </div>

    <div class="max-w-[720px] mx-auto bg-paper-raised border border-hairline rounded-md shadow-[var(--shadow-card-md)] p-6 sm:p-10" data-reveal>
      <!-- Front-end only: this project has no backend (see CLAUDE.md). Wire
           `action` to a real form-handling endpoint or form service before
           this goes live. -->
      <form action="/api/contact" method="post" aria-labelledby="contact-form-heading" class="grid sm:grid-cols-2 gap-x-6 gap-y-6">
        <div>
          <label for="cf-name" class="block text-[13px] font-semibold mb-2 text-ink">Name</label>
          <input type="text" id="cf-name" name="name" autocomplete="name" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
        </div>
        <div>
          <label for="cf-email" class="block text-[13px] font-semibold mb-2 text-ink">Work Email</label>
          <input type="email" id="cf-email" name="email" autocomplete="email" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
        </div>
        <div>
          <label for="cf-company" class="block text-[13px] font-semibold mb-2 text-ink">Company</label>
          <input type="text" id="cf-company" name="company" autocomplete="organization" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
        </div>
        <div>
          <label for="cf-team-size" class="block text-[13px] font-semibold mb-2 text-ink">Team Size</label>
          <select id="cf-team-size" name="team_size" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
            <option value="" disabled selected>Select team size</option>
            <option value="1-10">1&ndash;10</option>
            <option value="11-50">11&ndash;50</option>
            <option value="51-200">51&ndash;200</option>
            <option value="201-500">201&ndash;500</option>
            <option value="500+">500+</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label for="cf-challenge" class="block text-[13px] font-semibold mb-2 text-ink">What challenge are you trying to solve?</label>
          <textarea id="cf-challenge" name="challenge" rows="3" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200 resize-y"></textarea>
        </div>
        <div>
          <label for="cf-budget" class="block text-[13px] font-semibold mb-2 text-ink">Budget Range</label>
          <select id="cf-budget" name="budget" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
            <option value="" disabled selected>Select budget range</option>
            <option value="under-10k">Under $10k</option>
            <option value="10k-50k">$10k &ndash; $50k</option>
            <option value="50k-150k">$50k &ndash; $150k</option>
            <option value="150k-plus">$150k+</option>
            <option value="not-sure">Not sure yet</option>
          </select>
        </div>
        <div>
          <label for="cf-timeline" class="block text-[13px] font-semibold mb-2 text-ink">Timeline</label>
          <select id="cf-timeline" name="timeline" required
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200">
            <option value="" disabled selected>Select timeline</option>
            <option value="immediately">Immediately</option>
            <option value="1-month">Within 1 month</option>
            <option value="1-3-months">1&ndash;3 months</option>
            <option value="3-plus-months">3+ months</option>
            <option value="exploring">Just exploring</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label for="cf-context" class="block text-[13px] font-semibold mb-2 text-ink">Additional Context <span class="text-muted font-normal">(optional)</span></label>
          <textarea id="cf-context" name="context" rows="3"
            class="w-full rounded-md border border-hairline-strong bg-paper px-4 py-3 text-[14.5px] text-ink placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-tint transition-colors duration-200 resize-y"></textarea>
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="btn btn-primary w-full sm:w-auto justify-center">Request Strategy Session</button>
        </div>
      </form>
    </div>
  </div>
</section>
